<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h5 class="mb-3"><i class="fas fa-code-branch"></i> Open-Source Projects</h5>
                <ul class="list-unstyled mb-0">
                    {% for item in site.data.profile.projects %}
                    <li class="{% unless forloop.last %}mb-3{% endunless %}">
                        <div class="d-flex flex-wrap align-items-center">
                            <a href="https://github.com/{{ item.repo }}" target="_blank" class="font-weight-bold mr-2">{{ item.name }}</a>
                            <span class="small text-muted mr-2">{{ item.role }}</span>
                            <a class="github-button" href="https://github.com/{{ item.repo }}" data-show-count="true" aria-label="Star {{ item.repo }} on GitHub">Star</a>
                            {% if item.date %}<div class="small ml-auto no-break"><em>{{ item.date }}</em></div>{% endif %}
                        </div>
                        <div class="small mt-1">{{ item.description }}</div>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
