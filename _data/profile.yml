short_bio_text_justify: false
short_bio: >-
  <p>
    Hey, I'm Rixin. 
    I'm a first-year CS PhD student at Rice University advised by Prof. <a href="https://jxing.me/" target="_blank">Jiarong Xing</a>.
    Prior to this, I got my B.E. in Computer Science and Technology from South China University of Technology in 2025.
  </p>
  <p>
    My research centers on one question: <strong>How should we manage GPUs when they must serve more than one workload?</strong>
    I approach it through elastic GPU memory management, fault isolation and recovery, and multi-model serving. 
    I am broadly interested in building AI infrastructure for training, inference, and RL.
  </p>
  <p>
    I currently lead and maintain <a href="https://github.com/ovg-project/kvcached" target="_blank">kvcached</a>,
    a virtualized, elastic KV cache for dynamic GPU sharing that integrates with vLLM and SGLang
    and is deployed at scale by Tencent and adopted by <a href="https://github.com/rh-aiservices-bu/sardeenz" target="_blank">Red Hat's Sardeenz</a> for dynamic multi-model serving.
  </p>
  <p>
    I’m always happy to connect and discuss possible collaborations.
    Please don’t hesitate to contact me if you’re interested in related topics.
  </p>

