projects:
- name: kvcached
  repo: ovg-project/kvcached
  role: Project Lead & Maintainer
  date: May 2026 - present
  description: >-
    Virtualized, elastic KV cache for dynamic GPU sharing across colocated LLMs; integrates with <strong>vLLM</strong> and <strong>SGLang</strong>.
    2&ndash;28&times; lower TTFT when serving three Llama-3.1-8B models on one A100 versus static memory reservation.
    Deployed at scale by <strong>Tencent</strong> and adopted by <a href="https://github.com/rh-aiservices-bu/sardeenz" target="_blank">Red Hat's Sardeenz</a>.
- name: RouterArena
  repo: RouteWorks/RouterArena
  role: Co-developer
  description: >-
    Open evaluation platform and public leaderboard for LLM routers across 9 domains and 44 categories,
    spanning 33 academic and commercial routers; adopted by the <strong>vLLM Semantic Router</strong> project.

